<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#2a86c9">
  <title>マット運動 わざカード</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>マット<ruby>運動<rt>うんどう</rt></ruby> わざカード</h1>
    <p class="lead">やってみたい わざの カードを タッチしてね。お<ruby>手本<rt>てほん</rt></ruby>の <ruby>動画<rt>どうが</rt></ruby>が 見られるよ。</p>
  </header>

  <main>
    <div id="groups"></div>
  </main>

  <footer class="foot">
    <p>お手本動画：YouTube「<a id="channel-link" href="https://www.youtube.com/@benessekyouiku" target="_blank" rel="noopener">ベネッセ教育情報</a>」チャンネル「できたよ！マット運動」ほか（動画ウィンドウに各動画のチャンネル名を表示）</p>
  </footer>

  <!-- 動画ウィンドウ -->
  <dialog id="player" aria-labelledby="player-title">
    <div class="player-head">
      <div>
        <p class="player-yomi" id="player-yomi"></p>
        <h2 id="player-title"></h2>
      </div>
      <button type="button" class="close" id="player-close" aria-label="とじる">✕ とじる</button>
    </div>
    <p class="player-note" id="player-note" hidden></p>
    <div class="video-box" id="video-box"></div>
    <p class="player-point" id="player-point"></p>
    <div class="player-links">
      <p class="player-video-title" id="player-video-title"></p>
      <a id="player-yt" target="_blank" rel="noopener">YouTubeでひらく ↗</a>
    </div>
    <div class="extra" id="player-extra" hidden>
      <h3>れんしゅう動画</h3>
      <div class="extra-list" id="extra-list"></div>
    </div>
  </dialog>

  <script src="js/figure.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
